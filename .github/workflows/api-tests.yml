name: API tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Newman
        run: npm install --global newman@6.2.2
      - name: Run API scenarios
        run: >-
          newman run postman/Automation-Exercise-API-Testing.postman_collection.json
          --environment postman/Automation-Exercise-Sample.postman_environment.json
          --timeout-request 30000
          --reporters cli,junit
          --reporter-junit-export reports/api-tests.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: reports/
          if-no-files-found: warn
          retention-days: 14
